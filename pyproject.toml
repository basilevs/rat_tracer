[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rat_tracer"
version = "0.0.1"
dependencies = [
  "ultralytics>=8.4.0",
  "PySide6",
  "huggingface-hub",
]
requires-python = ">=3.13"
authors = [
  {name = "Gulevich Vasili", email = "basilevs@gmail.com"}
]
description = "Track a small animal as it traverses a labyrinth"
readme = "README.md"
license = "EPL-2.0"
license-files = ["LICEN[CS]E.*"]
keywords = ["Eclipse", "MANIFEST.MF"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[tool.hatch.build.targets.wheel]
packages=["rat_tracer"]

[project.optional-dependencies]
test = ["pytest"]
dev = [
  "ruff",
  "mypy",
  "pytest",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "network: test requires network access to Hugging Face",
]

[project.urls]
Homepage = "https://github.com/basilevs/rat_tracer"
Documentation = "https://github.com/basilevs/rat_tracer"
Repository = "https://github.com/basilevs/rat_tracer.git"
"Bug Tracker" = "https://github.com/basilevs/rat_tracer/issues"
Changelog = "https://github.com/basilevs/rat_tracer/commits/main/"

[project.scripts]
#where = "rat_tracer.where:main"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["rat_tracer", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
]
ignore = [
  "E501",  # line length is handled by the formatter
]

