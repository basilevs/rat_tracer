[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rat_tracer"
version = "0.0.1"
dependencies = [
  "ultralytics>=8.4.0",
  "PySide6>=6.11,<7",
  "PySide6-Essentials>=6.11,<7",
  "PySide6-Addons>=6.11,<7",
  "huggingface-hub",
]
requires-python = ">=3.13"
authors = [
  {name = "Gulevich Vasili", email = "basilevs@gmail.com"}
]
description = "Track a small animal as it traverses a labyrinth"
readme = "README.md"
license = "EPL-2.0"
license-files = ["LICEN[CS]E.*"]
keywords = ["Eclipse", "MANIFEST.MF"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[tool.hatch.build.targets.wheel]
packages=["rat_tracer"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = [
  "rat_tracer[test]",
  "ruff",
  "mypy",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "network: test requires network access to Hugging Face",
]

[project.scripts]
rat_tracer = "rat_tracer.ui:main"
rat_tracer-collect = "rat_tracer.collect:main"

[project.urls]
Homepage = "https://github.com/basilevs/rat_tracer"
Documentation = "https://github.com/basilevs/rat_tracer"
Repository = "https://github.com/basilevs/rat_tracer.git"
"Bug Tracker" = "https://github.com/basilevs/rat_tracer/issues"
Changelog = "https://github.com/basilevs/rat_tracer/commits/main/"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["rat_tracer", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
]
ignore = [
  "E501",  # line length is handled by the formatter
]

[tool.mypy]
python_version = "3.13"
files = ["rat_tracer", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# The existing scripts are largely unannotated; enable annotation enforcement
# incrementally per-module rather than mandating it repo-wide on day one.
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Third-party libraries that ship no type information or only partial stubs.
[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "torch.*",
  "torchvision.*",
  "ultralytics.*",
  "PySide6.*",
  "coremltools.*",
  "lap.*",
  "huggingface_hub.*",
  "wakepy.*",
  "imageio.*",
  "imageio_ffmpeg.*",
  "psutil.*",
]
ignore_missing_imports = true

